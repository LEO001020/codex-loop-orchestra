<svg width="1600" height="1320" id="architecture" class="theme-light" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">ZCode-ZLoop Native Multi-Agent Architecture Overview</title>
  <desc id="desc">ZCode-ZLoop native architecture overview: sole root cognition, pre-planning ChatGPT audit, physical worktree concurrency, atomic staging rollback, and heterogeneous GLM-5.3 promotion gate.</desc>
