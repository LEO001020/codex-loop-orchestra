[pytest]
# Root test configuration.
#
# tests/orchestration_v2 is the authoritative v2 overlay suite with its own
# conftest.py. Without __init__.py files, collecting it TOGETHER with the
# legacy tree collides on top-level module names (conftest, test_agent_
# router, test_dispatch_v2, ... are duplicated in both trees) and aborts
# collection with import-file-mismatch errors. The suites therefore run
# isolated:
#
#   pytest tests/                      -> legacy F2 suite (whole tree)
#   pytest tests/orchestration_v2      -> the authoritative v2 suite
#
# norecursedirs only affects recursive discovery, so naming the v2
# directory explicitly on the command line still collects it.
norecursedirs = .* build dist CVS _darcs {arch} *.egg orchestration_v2
