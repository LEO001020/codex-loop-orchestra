# VERSIONS.lock — Codex-LOOP-Build-F2 environment package
# Generated by claude_fable_5 (Phase3-EnvSetup). All values verified in-environment
# or against research_findings_phase1.md (facts verified 2026-08-08 via primary sources).

[cli]
codex_cli = "0.147.0"            # codex-cli 0.147.0 (npm @openai/codex), REAL: installed and version-checked in this environment
codex_cli_version = "0.147.0"   # machine-readable alias consumed by harness/smoke_gate.sh version check
node = "v22.23.2"                # Node.js 22 LTS "Jod", REAL: installed from official nodejs.org tarball
npm = "10.9.8"                   # bundled with Node v22.23.2

[models]
# Tier names per research_findings_phase1.md §7 (OpenAI models page, verified 2026-08-08).
# gpt-5.6 is an alias of gpt-5.6-sol; CLI 0.147.0 banner confirms default model gpt-5.6-sol (REAL).
high = "gpt-5.6-sol"             # root orchestration/adjudication/fallback only
mid = "weiwu-k3/kimi-k3"         # L2 verifier + release reviewer, Kimi K3 enterprise API
low = "weiwu/deepseek-v4-flash"  # L1 worker/scout/duty_officer; backend-locked V4 Flash API
# Avoid gpt-5.4 / gpt-5.4-mini: retired from ChatGPT-auth Codex on 2026-08-31
# (research_findings_phase1.md §7, codex-docs changelog).

[reasoning_effort]
high = "high"                    # root Sol orchestration/adjudication depth
mid = "max"                      # Kimi K3 verification + release-review depth
low = "ultra"                    # L1 V4 Flash depth for worker/scout/duty_officer

[lifecycle]
schema = "codex-loop-lifecycle/v2"
max_concurrent_threads_per_session = 50
normal_v4_wave = 16
normal_k3_wave = 16
normal_v4_low_water = 12
normal_k3_low_water = 12
idle_reclaim_threshold = 0
sustained_refill = "mechanical-running-only; per-pool debt; idle-reuse-or-close"
windows_boundary = "job-object-kill-on-close"
posix_boundary = "process-group-with-generation-cancel-and-cold-start-reap"
desktop_edge_repair = "dry-run-default; offline-backup-required"
claude_code_reference_date = "2026-08-10"
claude_code_completed_task_behavior_min = "2.1.208"

[ipybox]
version = "0.9.2"                     # ipybox 0.9.2 (PyPI), REAL: installed and MCP-verified in install test 2026-08-10 (initialize / tools / execute / cross-cell state)
mcp_constraint = "mcp<2"              # REQUIRED pin: ipybox 0.9.2 dependency mcpygen 0.1.4 breaks with mcp 2.0.0 (streamablehttp_client removed); install as: pip install ipybox "mcp<2" (resolves mcp 1.x). VERSION_BOUND: drop once upstream fixes.
install = "pip install ipybox \"mcp<2\""   # preferred form; alternative: uvx --with "mcp<2" ipybox --workspace ./data
image = "ghcr.io/gradion-ai/ipybox"   # kernel-runtime-container form ONLY (image has no ipybox module, not a stdio MCP server — verified negative result, ipybox_install_report.md §4-A); conditional-enable, needs extra MCP bridge

