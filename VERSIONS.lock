# Metadata only. Not a dependency resolver: the runtime never requires an exact
# version, never polls npm, and never upgrades. LOOP runs with no gateway at all.
# See docs/OPENCODEX.md. Re-certify only when changing this pin, changing the
# tested Codex baseline, or on an actual compatibility regression.
# Local-patch kit: after the 2026-09-01 upgrade to 2.39.0, upstream absorbed 8
# of the 10 prior local edits; only the snaillmou schema flattening
# (adapters/openai-chat.ts) and a 3-line cooperative yield
# (responses/state.ts) remain. Kit: E:\codex-LOOP\_upgrade-staging\REAPPLY.md.
[optional_gateway.opencodex]
package = "@bitkyc08/opencodex"
tested_version = "2.39.0"           # upgraded from 2.10.0 and re-certified on the live host 2026-09-01
previous_tested_version = "2.10.0"  # superseded same day; its kit was the upgrade path
tested_bundled_bun = "1.4.0"        # pinned in that version's package.json (2.10.0 bundled 1.3.14)
tested_against_codex_cli = "0.147.0"  # matches [cli].codex_cli_version above; baseline unchanged
tested_against_codex_desktop = "26.825.5331.0"  # MSIX; a separate runtime from the standalone CLI
readiness_path = "/readyz"          # real JSON readiness on >= 2.11.0 ({"status":"ready"}); on 2.10.x use /healthz — /readyz hit the dashboard SPA catch-all there
adapter = "openai-chat"             # for providers exposing only POST /v1/chat/completions
web_search_sidecar = "openai"       # forward provider + converted ws-credentials auth.json; expires 2026-09-10
certified = "2026-09-01"
