# Codex LOOP execution-plane safety policy.
# This file is intentionally separate from Codex's native config.toml.  Codex
# owns host slot limits; LOOP owns the smaller effective worker target and the
# rate at which headless workers are born.

[concurrency]
target_total = 48
v4_target = 36
k3_target = 12
v4_low_water = 27
k3_low_water = 9

[spawn_throttle]
spawn_interval_ms = 1000
max_initializing = 8
health_gate_every = 8
failure_backoff_seconds = 30
health_timeout_ms = 2000
