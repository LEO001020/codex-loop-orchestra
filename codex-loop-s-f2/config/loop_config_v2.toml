# ============================================================================
# loop_config_v2.toml — SINGLE concurrency authority (P0-8.3 fix)
# ----------------------------------------------------------------------------
# Purpose : the only source of truth for slot topology and spawn throttle.
#           Every other file (VERSIONS.lock, config.toml.example,
#           orchestration_policy_v2.toml) REFERENCES this file, never copies.
#           Readers that cannot parse this file must FAIL CLOSED AND VISIBLE
#           (exit with an error event) — never fall back to a silent default
#           (fixes the 16/16-vs-48 divergent-fallback defect,
#           phase1b_codebase_analysis.md P0-8.3 / P1-1).
# Readers : dispatch, refill_controller, layered_gate, lifecycle_supervisor_v2
# ============================================================================

schema = "codex-loop-config/v2"
policy_version = 2

[concurrency]
target_total = 48         # LOOP target = 48
v4_target = 36            # exec = 36
k3_target = 12            # k3 = 12
v4_low_water = 27
k3_low_water = 9
reservations_borrowable = true   # borrowable = true: K3 slots lend to V4
                                 # when (and only when) k3 queue is empty

[spawn_throttle]
spawn_interval_ms = 1000  # spawn = 1000ms
max_initializing = 8
health_gate_every = 8
failure_backoff_seconds = 30
health_timeout_ms = 2000

[state]
# refill_state.json must record {policy_version, policy_mtime}; a mismatch
# forces recompute — stale 24/18/6 state can never silently win.
recompute_on_version_mismatch = true
